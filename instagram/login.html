<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Style Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <div class="container">
    <main class="login-box">
      <h1 class="logo">Instagram</h1>

      <form class="login-form">
        <div class="input-field">
          <input type="text" placeholder="電話番号、ユーザーネーム、メールアドレス" required>
        </div>
        <div class="input-field">
          <input type="password" placeholder="パスワード" required>
        </div>
        <button type="submit" class="submit-btn">ログイン</button>
      </form>

      <div class="separator">
        <span class="line"></span>
        <span class="or">または</span>
        <span class="line"></span>
      </div>

      <div class="other-links">
        <button class="fb-login-btn">
          <i class="fab fa-facebook-square"></i> Facebookでログイン
        </button>
        <a href="#" class="forgot-password">パスワードを忘れた場合</a>
      </div>
    </main>

    <footer class="signup-box">
      <p>アカウントをお持ちでないですか？ <a href="#">登録する</a></p>
    </footer>
  </div>

</body>
</html>
